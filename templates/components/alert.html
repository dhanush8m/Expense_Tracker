{% if messages %}
<div class="space-y-2 mb-3">
    {% for message in messages %}
    <div class="flex items-center justify-between p-3.5 rounded-xl text-sm font-medium border shadow-sm transition-all duration-300
        {% if message.tags == 'success' %}
            bg-emerald-50 text-emerald-800 border-emerald-200
        {% elif message.tags == 'error' %}
            bg-rose-50 text-rose-800 border-rose-200
        {% elif message.tags == 'warning' %}
            bg-amber-50 text-amber-800 border-amber-200
        {% else %}
            bg-sky-50 text-sky-800 border-sky-200
        {% endif %}">
        <div class="flex items-center space-x-2">
            <span>
                {% if message.tags == 'success' %}✓
                {% elif message.tags == 'error' %}✕
                {% elif message.tags == 'warning' %}⚠
                {% else %}ℹ{% endif %}
            </span>
            <span>{{ message }}</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-xs opacity-60 hover:opacity-100 font-bold ml-2">
            ✕
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
