{% if messages %}
<div class="space-y-2 mb-2">
    {% for message in messages %}
    <div class="flex items-center justify-between p-3 rounded-xl text-xs font-medium border shadow-xs transition-all duration-300
        {% if message.tags == 'success' %}
            bg-emerald-50/80 text-emerald-900 border-emerald-200
        {% elif message.tags == 'error' %}
            bg-rose-50/80 text-rose-900 border-rose-200
        {% elif message.tags == 'warning' %}
            bg-amber-50/80 text-amber-900 border-amber-200
        {% else %}
            bg-slate-50 text-slate-900 border-slate-200
        {% endif %}">
        <div class="flex items-center space-x-2">
            <span class="flex-shrink-0">
                {% if message.tags == 'success' %}
                <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
                {% elif message.tags == 'error' %}
                <svg class="w-4 h-4 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                {% elif message.tags == 'warning' %}
                <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                {% else %}
                <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                {% endif %}
            </span>
            <span>{{ message }}</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md transition ml-2">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
